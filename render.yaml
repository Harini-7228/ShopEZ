services:
  - type: web
    name: shopez-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set the following secrets in the Render dashboard (do NOT hardcode here):
      # MONGO_URI, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, CORS_ORIGIN
    healthCheckPath: /healthz
